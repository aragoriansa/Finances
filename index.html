<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финанси €</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #1e40af; padding: 15px; margin: 0; }
        .box { max-width: 550px; margin: 0 auto; background: #f0f9ff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        h2 { text-align: center; font-size: 18px; margin-top: 25px; margin-bottom: 12px; color: #1e3a8a; }
        h2:first-of-type { margin-top: 5px; font-size: 22px; }
        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #7dd3fc; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: white; color: #1e3a8a; }
        button { background: #1d4ed8; color: white; font-weight: bold; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: white; border-radius: 6px; overflow: hidden; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #e0f2fe; }
        th { background: #0284c7; color: white; }
        .badge { padding: 2px 5px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-up { background: #dcfce7; color: #16a34a; }
        .badge-down { background: #fee2e2; color: #dc2626; }
        .btn-edit { background: #ea580c; color: white; padding: 4px 8px; border-radius: 4px; border: none; }
        .btn-del { background: #dc2626; color: white; padding: 4px 8px; border-radius: 4px; margin-left: 4px; border: none; }
        .toggle-btn { background: #0284c7; margin: 15px 0 10px 0; }
        .clear-btn { background: #94a3b8; margin-top: 25px; color: white; }
        .chart-wrap { height: 220px; margin: 15px 0; background: white; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        #months-container { display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>📊 Финансов Дневник (€)</h2>
    <div class="row">
        <select id="year">
            <option value="2025">2025 г.</option>
            <option value="2026" selected>2026 г.</option>
            <option value="2027">2027 г.</option>
        </select>
        <select id="month">
            <option value="Януари">Януари</option><option value="Февруари">Февруари</option><option value="Март">Март</option>
            <option value="Април">Април</option><option value="Май">Май</option><option value="Юни">Юни</option>
            <option value="Юли">Юли</option><option value="Август">Август</option><option value="Септември">Септември</option>
            <option value="Октомври">Октомври</option><option value="Ноември">Ноември</option><option value="Декември">Декември</option>
        </select>
    </div>
    
    <div class="row">
        <select id="category">
            <option value="Заплата">💼 Заплата</option>
            <option value="Пенсия">👴 Пенсия</option>
            <option value="Социални">🏛️ Социални</option>
            <option value="Бонус">🎁 Бонус</option>
        </select>
        <input type="number" id="amount" placeholder="Сума (€)" min="0" step="0.01">
    </div>
    
    <button id="submit-btn" onclick="addIncome()">ЗАПИШИ СУМА</button>

    <h2>📈 Сравнение по Години</h2>
    <table>
        <thead><tr><th>Година</th><th>Общ Приход</th><th>Спрямо минала</th></tr></thead>
        <tbody id="stats-table"></tbody>
    </table>
    <div class="chart-wrap"><canvas id="financeChart"></canvas></div>

    <button class="toggle-btn" onclick="toggleMonthsList()">👁️ Покажи / Скрий месечния списък</button>
    <div id="months-container">
        <h2>✏️ Списък по Месеци (Сравнение)</h2>
        <table>
            <thead><tr><th>Месец / Година</th><th>Източник</th><th>Сума</th><th>Спрямо м.г.</th><th>Действие</th></tr></thead>
            <tbody id="entries-table"></tbody>
        </table>
    </div>

    <h2>📊 Детайлна статистика за година:</h2>
    <div style="margin-bottom: 10px;">
        <select id="filter-chart-year" onchange="updateUI()"></select>
    </div>
    
    <h3>📈 Трендове по месеци</h3>
    <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
    
    <h3>🔵 Разпределение по източници</h3>
    <div class="chart-wrap" style="height: 250px;"><canvas id="pieChart"></canvas></div>

    <button class="clear-btn" onclick="clearData()">ИЗЧИСТИ ВСИЧКО</button>
</div>
<script>
    let incomes = JSON.parse(localStorage.getItem('financial_diary')) || [];
    let myChart = null; let mChart = null; let pChart = null; let editIndex = null;
    const mOrder = ["Януари", "Февруари", "Март", "Април", "Май", "Юни", "Юли", "Август", "Септември", "Октомври", "Ноември", "Декември"];

    function addIncome() {
        const year = document.getElementById('year').value;
        const month = document.getElementById('month').value;
        const category = document.getElementById('category').value;
        const amount = parseFloat(document.getElementById('amount').value);
        if (isNaN(amount) || amount <= 0) { alert("Въведете сума!"); return; }

        if (editIndex !== null) {
            incomes[editIndex] = { year, month, category, amount };
            editIndex = null;
            document.getElementById('submit-btn').innerText = "ЗАПИШИ СУМА";
        } else {
            const idx = incomes.findIndex(i => i.year === year && i.month === month && i.category === category);
            if (idx !== -1) {
                if(confirm(`Има запис за ${category} през този месец. Да добавя ли сумата?`)) incomes[idx].amount += amount;
                else return;
            } else { incomes.push({ year, month, category, amount }); }
        }
        localStorage.setItem('financial_diary', JSON.stringify(incomes));
        updateYearDropdowns(); 
        updateUI();
        document.getElementById('amount').value = '';
    }

    function editEntry(uid) {
        const idx = incomes.findIndex(i => (i.year + '-' + i.month + '-' + i.category) === uid);
        if (idx === -1) return;
        editIndex = idx;
        document.getElementById('year').value = incomes[idx].year;
        document.getElementById('month').value = incomes[idx].month;
        document.getElementById('category').value = incomes[idx].category;
        document.getElementById('amount').value = incomes[idx].amount;
        document.getElementById('submit-btn').innerText = "ОБНОВИ ЗАПИСА";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(uid) {
        if (confirm("Изтриване?")) {
            const idx = incomes.findIndex(i => (i.year + '-' + i.month + '-' + i.category) === uid);
            if (idx !== -1) { incomes.splice(idx, 1); localStorage.setItem('financial_diary', JSON.stringify(incomes)); updateYearDropdowns(); updateUI(); }
        }
    }

    function toggleMonthsList() {
        const c = document.getElementById('months-container');
        c.style.display = (c.style.display === "block") ? "none" : "block";
    }

    function updateYearDropdowns() {
        const sel = document.getElementById('filter-chart-year');
        const curr = sel.value;
        let years = [...new Set(incomes.map(i => i.year))].sort();
        if (years.length === 0) years = ["2026"];
        sel.innerHTML = '';
        years.forEach(y => { sel.innerHTML += `<option value="${y}">${y} г.</option>`; });
        if (curr && years.includes(curr)) sel.value = curr;
        else sel.value = years[years.length - 1];
    }

    function updateUI() {
        incomes.sort((a, b) => {
            if (a.year !== b.year) return b.year - a.year;
            return mOrder.indexOf(a.month) - mOrder.indexOf(b.month);
        });

        const tStats = document.getElementById('stats-table'); tStats.innerHTML = '';
        let yTotals = {}; incomes.forEach(i => { yTotals[i.year] = (yTotals[i.year] || 0) + i.amount; });
        const sYears = Object.keys(yTotals).sort();

        sYears.forEach((y, idx) => {
            let trend = '---';
            if (idx > 0) {
                const prev = yTotals[sYears[idx - 1]];
                if (prev > 0) {
                    const diff = ((yTotals[y] - prev) / prev) * 100;
                    trend = diff > 0 ? `<span class="badge badge-up">▲ +${diff.toFixed(1)}%</span>` : `<span class="badge badge-down">▼ ${diff.toFixed(1)}%</span>`;
                }
            }
            tStats.innerHTML += `<tr><td><strong>${y} г.</strong></td><td>${yTotals[y].toFixed(2)} €</td><td>${trend}</td></tr>`;
        });

        const tEntries = document.getElementById('entries-table'); tEntries.innerHTML = '';
        let monthlySum = {}; incomes.forEach(i => { let key = i.year + '-' + i.month; monthlySum[key] = (monthlySum[key] || 0) + i.amount; });

        incomes.forEach((e) => {
            const pYear = (parseInt(e.year) - 1).toString();
            const currentMonthSum = monthlySum[e.year + '-' + e.month] || 0;
            const prevMonthSum = monthlySum[pYear + '-' + e.month] || 0;
            let mTrend = '---';
            if (prevMonthSum > 0) {
                const mDiff = ((currentMonthSum - prevMonthSum) / prevMonthSum) * 100;
                mTrend = mDiff > 0 ? `<span class="badge badge-up">▲ +${mDiff.toFixed(1)}%</span>` : `<span class="badge badge-down">▼ ${mDiff.toFixed(1)}%</span>`;
            }
            const uid = `${e.year}-${e.month}-${e.category}`;
            tEntries.innerHTML += `<tr><td>${e.month} ${e.year} г.</td><td>${e.category}</td><td><strong>${e.amount.toFixed(2)} €</strong></td><td>${mTrend}</td><td><button class="btn-edit" onclick="editEntry('${uid}')">✏️</button><button class="btn-del" onclick="deleteEntry('${uid}')">🗑️</button></td></tr>`;
        });

        if (incomes.length === 0) {
            tStats.innerHTML = `<tr><td colspan="3" style="text-align:center;">Няма данни.</td></tr>`;
            tEntries.innerHTML = `<tr><td colspan="5" style="text-align:center;">Няма добавени месеци.</td></tr>`;
        }

        if (myChart) myChart.destroy();
        myChart = new Chart(document.getElementById('financeChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: sYears.length ? sYears.map(y => y + " г.") : ["Няма данни"],
                datasets: [{ label: 'Приход (€)', data: sYears.length ? sYears.map(y => yTotals[y]) :, backgroundColor: 'rgba(29, 78, 216, 0.3)', borderColor: '#1d4ed8', borderWidth: 2, borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const sYear = document.getElementById('filter-chart-year').value || "2026";
        let mData = Array(12).fill(0);
        incomes.forEach(i => { if (i.year === sYear) { const mIdx = mOrder.indexOf(i.month); if (mIdx !== -1) mData[mIdx] += i.amount; } });

        if (mChart) mChart.destroy();
        mChart = new Chart(document.getElementById('monthlyChart').getContext('2d'), {
            type: 'line',
            data: {
                labels: mOrder.map(m => m.substring(0, 3)),
                datasets: [{ label: `Приход (€)`, data: mData, backgroundColor: 'rgba(2, 132, 199, 0.1)', borderColor: '#0284c7', borderWidth: 3, tension: 0.3, fill: true }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        let catTotals = { "Заплата": 0, "Пенсия": 0, "Социални": 0, "Бонус": 0 };
        incomes.forEach(i => { if (i.year === sYear) { catTotals[i.category] = (catTotals[i.category] || 0) + i.amount; } });

        if (pChart) pChart.destroy();
        pChart = new Chart(document.getElementById('pieChart').getContext('2d'), {
            type: 'pie',
            data: {
                labels: Object.keys(catTotals),
                datasets: [{ data: Object.values(catTotals), backgroundColor: ['#2563eb', '#ea580c', '#16a34a', '#eab308'], borderWidth: 1 }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function clearData() {
        if (confirm("Изтриване на всичко?")) { localStorage.removeItem('financial_diary'); incomes = []; if (myChart) myChart.destroy(); if (mChart) mChart.destroy(); if (pChart) pChart.destroy(); updateYearDropdowns(); updateUI(); }
    }
    
    updateYearDropdowns();
    updateUI();
</script>
</body>
</html>
