<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансов Дневник</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --dark: #1e293b;
            --light: #f8fafc;
            --warning: #ea580c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            box-sizing: border-box;
        }
        h1, h2 { text-align: center; color: var(--dark); margin-top: 25px; font-size: 20px; }
        h1 { margin-top: 5px; font-size: 24px; }
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
        }
        .form-group .full-width {
            grid-column: span 2;
        }
        label { font-weight: 600; font-size: 13px; margin-bottom: 4px; display: block; }
        select, input, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: white;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th { background-color: #f1f5f9; }
        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }
        .badge-up { background-color: #dcfce7; color: var(--success); }
        .badge-down { background-color: #fee2e2; color: var(--danger); }
        .badge-neutral { background-color: #f1f5f9; color: #64748b; }
        .chart-container {
            position: relative;
            margin: 20px auto;
            height: 250px;
            width: 100%;
        }
        .btn-edit { background-color: var(--warning); color: white; padding: 4px 8px; font-size: 12px; width: auto; display: inline-block; margin-right: 5px; border-radius: 4px;}
        .btn-delete { background-color: var(--danger); color: white; padding: 4px 8px; font-size: 12px; width: auto; display: inline-block; border-radius: 4px;}
        .clear-btn {
            background-color: #94a3b8;
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Финансов Дневник (€)</h1>
    
    <div class="form-group">
        <div>
            <label for="year">Година</label>
            <select id="year">
                <option value="2025">2025 г.</option>
                <option value="2026" selected>2026 г.</option>
                <option value="2027">2027 г.</option>
                <option value="2028">2028 г.</option>
            </select>
        </div>
        <div>
            <label for="month">Месец</label>
            <select id="month">
                <option value="Януари">Януари</option>
                <option value="Февруари">Февруари</option>
                <option value="Март">Март</option>
                <option value="Април">Април</option>
                <option value="Май">Май</option>
                <option value="Юни">Юни</option>
                <option value="Юли">Юли</option>
                <option value="Август">Август</option>
                <option value="Септември">Септември</option>
                <option value="Октомври">Октомври</option>
                <option value="Ноември">Ноември</option>
                <option value="Декември">Декември</option>
            </select>
        </div>
        <div class="full-width">
            <label for="amount">Приход (€)</label>
            <input type="number" id="amount" placeholder="Въведи сума в евро" min="0" step="0.01">
        </div>
        <div class="full-width">
            <button id="submit-btn" onclick="addIncome()">Запиши</button>
        </div>
    </div>

    <h2>📈 Годишно Сравнение</h2>
    <table>
        <thead>
            <tr>
                <th>Година</th>
                <th>Приход</th>
                <th>Спрямо предходна</th>
            </tr>
        </thead>
        <tbody id="stats-table"></tbody>
    </table>

    <div class="chart-container">
        <canvas id="financeChart"></canvas>
    </div>

    <h2>✏️ Детайлен преглед и Редактиране</h2>
    <table>
        <thead>
            <tr>
                <th>Период</th>
                <th>Сума</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="entries-table"></tbody>
    </table>

    <button class="clear-btn" onclick="clearData()">Изчисти абсолютно всички данни</button>
</div>

<script>
    let incomes = JSON.parse(localStorage.getItem('financial_diary')) || [];
    let myChart = null;
    let editIndex = null; // Следи дали редактираме в момента

    const monthOrder = ["Януари", "Февруари", "Март", "Април", "Май", "Юни", "Юли", "Август", "Септември", "Октомври", "Ноември", "Декември"];

    function addIncome() {
        const year = document.getElementById('year').value;
        const month = document.getElementById('month').value;
        const amount = parseFloat(document.getElementById('amount').value);

        if (isNaN(amount) || amount <= 0) {
            alert("Моля, въведете валидна сума.");
            return;
        }

        if (editIndex !== null) {
            // Ако сме в режим на редактиране, променяме стария запис
            incomes[editIndex] = { year, month, amount };
            editIndex = null;
            document.getElementById('submit-btn').innerText = "Запиши";
            document.getElementById('submit-btn').style.backgroundColor = "var(--primary)";
        } else {
            // Проверка за дублиращ се месец в същата година при нов запис
            const existingIndex = incomes.findIndex(i => i.year === year && i.month === month);
            if (existingIndex !== -1) {
                if(confirm(`Вече имаш запис за ${month} ${year} г. Искаш ли да добавиш тази сума към съществуващата?`)) {
                    incomes[existingIndex].amount += amount;
                } else {
                    return;
                }
            } else {
                incomes.push({ year, month, amount });
            }
        }

        saveData();
        updateUI();
        document.getElementById('amount').value = '';
    }

    function editEntry(index) {
        editIndex = index;
        const entry = incomes[index];
        
        document.getElementById('year').value = entry.year;
        document.getElementById('month').value = entry.month;
        document.getElementById('amount').value = entry.amount;
        
        document.getElementById('submit-btn').innerText = "Обнови Записа";
        document.getElementById('submit-btn').style.backgroundColor = "var(--warning)";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(index) {
        if (confirm("Сигурен ли си, че искаш да изтриеш този месечен запис?")) {
            incomes.splice(index, 1);
            saveData();
            updateUI();
        }
    }

    function calculateYearlyTotals() {
        let yearlyTotals = {};
        incomes.forEach(item => {
            if (!yearlyTotals[item.year]) yearlyTotals[item.year] = 0;
            yearlyTotals[item.year] += item.amount;
        });
        return yearlyTotals;
    }

    function updateUI() {
        // Сортиране на списъка с записи по година и месец за детайлния преглед
        incomes.sort((a, b) => {
            if (a.year !== b.year) return b.year - a.year; // Новите години най-отгоре
            return monthOrder.indexOf(b.month) - monthOrder.indexOf(a.month);
        });

        // 1. Обновяване на таблицата с години
        const tbodyStats = document.getElementById('stats-table');
        tbodyStats.innerHTML = '';
        const yearlyTotals = calculateYearlyTotals();
        const sortedYears = Object.keys(yearlyTotals).sort();
        const chartLabels = [];
        const chartData = [];

        sortedYears.forEach((year, index) => {
            const currentTotal = yearlyTotals[year];
            chartLabels.push(year + " г.");
            chartData.push(currentTotal);
            let trendHtml = '<span class="badge badge-neutral">---</span>';

            if (index > 0) {
                const prevTotal = yearlyTotals[sortedYears[index - 1]];
                if (prevTotal > 0) {
                    const percentChange = ((currentTotal - prevTotal) / prevTotal) * 100;
