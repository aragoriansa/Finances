<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финанси €</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; background: #e0f2fe; padding: 15px; margin: 0; }
        .box { max-width: 550px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); box-sizing: border-box; }
        h2 { text-align: center; font-size: 18px; margin-top: 25px; margin-bottom: 12px; color: #0369a1; }
        h2:first-of-type { margin-top: 5px; font-size: 22px; }
        .row { display: flex; gap: 10px; margin-bottom: 12px; }
        select, input, button { width: 100%; padding: 12px; border: 1px solid #bae6fd; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: white; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid #e0f2fe; }
        th { background: #f0f9ff; color: #0369a1; }
        .badge { padding: 2px 5px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-up { background: #dcfce7; color: #16a34a; }
        .badge-down { background: #fee2e2; color: #dc2626; }
        .badge-neutral { background: #f1f5f9; color: #64748b; }
        .btn-edit { background: #ea580c; color: white; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-del { background: #dc2626; color: white; padding: 4px 8px; border-radius: 4px; margin-left: 4px; border: none; cursor: pointer; }
        .clear-btn { background: #94a3b8; margin-top: 25px; }
        .chart-wrap { height: 220px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="box">
    <h2>📊 Финансов Дневник (€)</h2>
    
    <div class="row">
        <select id="year">
            <option value="2024">2024 г.</option>
            <option value="2025">2025 г.</option>
            <option value="2026" selected>2026 г.</option>
            <option value="2027">2027 г.</option>
        </select>
        <select id="month">
            <option value="Януари">Януари</option><option value="Февруари">Февруари</option><option value="Март">Март</option>
            <option value="Април">Април</option><option value="Май">Май</option><option value="Юни">Юни</option>
            <option value="Юли">Юли</option><option value="Август">Август</option><option value="Септември">Септември</option>
            <option value="Октомври">Октомври</option><option value="Ноември">Ноември</option><option value="Декември">Декември</option>
        </select>
    </div>
    
    <div style="margin-bottom: 12px;"><input type="number" id="amount" placeholder="Въведи приход (€)" min="0" step="0.01"></div>
    <button id="submit-btn" onclick="addIncome()">ЗАПИШИ СУМА</button>

    <h2>📈 Сравнение по Години</h2>
    <table>
        <thead><tr><th>Година</th><th>Общ Приход</th><th>Спрямо минала</th></tr></thead>
        <tbody id="stats-table"></tbody>
    </table>

    <div class="chart-wrap"><canvas id="financeChart"></canvas></div>

    <h2>✏️ Списък по Месеци (Сравнение)</h2>
    <table>
        <thead><tr><th>Месец / Година</th><th>Сума</th><th>Спрямо м.г.</th><th>Действие</th></tr></thead>
        <tbody id="entries-table"></tbody>
    </table>
    <button class="clear-btn" onclick="clearData()">ИЗЧИСТИ Всичко</button>
</div>

<script>
    let incomes = JSON.parse(localStorage.getItem('financial_diary')) || [];
    let myChart = null; let editIndex = null;
    const monthOrder = ["Януари", "Февруари", "Март", "Април", "Май", "Юни", "Юли", "Август", "Септември", "Октомври", "Ноември", "Декември"];

    function addIncome() {
        const year = document.getElementById('year').value;
        const month = document.getElementById('month').value;
        const amount = parseFloat(document.getElementById('amount').value);
        if (isNaN(amount) || amount <= 0) { alert("Въведете сума!"); return; }

        if (editIndex !== null) {
            incomes[editIndex] = { year, month, amount };
            editIndex = null;
            document.getElementById('submit-btn').innerText = "ЗАПИШИ СУМА";
        } else {
            const idx = incomes.findIndex(i => i.year === year && i.month === month);
            if (idx !== -1) {
                if(confirm("Има запис. Да добавя ли сумата?")) incomes[idx].amount += amount;
                else return;
            } else { incomes.push({ year, month, amount }); }
        }
        localStorage.setItem('financial_diary', JSON.stringify(incomes));
        updateUI();
        document.getElementById('amount').value = '';
    }

    function editEntry(uid) {
        const idx = incomes.findIndex(i => (i.year + '-' + i.month) === uid);
        if (idx === -1) return;
        editIndex = idx;
        document.getElementById('year').value = incomes[idx].year;
        document.getElementById('month').value = incomes[idx].month;
        document.getElementById('amount').value = incomes[idx].amount;
        document.getElementById('submit-btn').innerText = "ОБНОВИ ЗАПИСА";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteEntry(uid) {
        if (confirm("Изтриване?")) {
            const idx = incomes.findIndex(i => (i.year + '-' + i.month) === uid);
            if (idx !== -1) { incomes.splice(idx, 1); localStorage.setItem('financial_diary', JSON.stringify(incomes)); updateUI(); }
        }
    }

    function updateUI() {
        incomes.sort((a, b) => {
            if (a.year !== b.year) return b.year - a.year;
            return monthOrder.indexOf(a.month) - monthOrder.indexOf(b.month);
        });

        const tbodyStats = document.getElementById('stats-table'); tbodyStats.innerHTML = '';
        let yearlyTotals = {}; incomes.forEach(i => { yearlyTotals[i.year] = (yearlyTotals[i.year] || 0) + i.amount; });
        const sortedYears = Object.keys(yearlyTotals).sort();

        sortedYears.forEach((year, index) => {
            let trend = '---';
            if (index > 0) {
                const prev = yearlyTotals[sortedYears[index - 1]];
                if (prev > 0) {
                    const change = ((yearlyTotals[year] - prev) / prev) * 100;
                    trend = change > 0 ? `▲ +${change.toFixed(1)}%` : `▼ ${change.toFixed(1)}%`;
                }
            }
            tbodyStats.innerHTML += `<tr><td><strong>${year} г.</strong></td><td>${yearlyTotals[year].toFixed(2)} €</td><td>${trend}</td></tr>`;
        });

        const tbodyEntries = document.getElementById('entries-table'); tbodyEntries.innerHTML = '';
        incomes.forEach((e) => {
            const prevYearStr = (parseInt(e.year) - 1).toString();
            const prevMatch = incomes.find(i => i.year === prevYearStr && i.month === e.month);
            let mTrend = '---';
            if (prevMatch && prevMatch.amount > 0) {
                const mChange = ((e.amount - prevMatch.amount) / prevMatch.amount) * 100;
                mTrend = mChange > 0 ? `▲ +${mChange.toFixed(1)}%` : `▼ ${mChange.toFixed(1)}%`;
            }
            const uid = `${e.year}-${e.month}`;
            tbodyEntries.innerHTML += `<tr><td>${e.month} ${e.year} г.</td><td><strong>${e.amount.toFixed(2)} €</strong></td><td>${mTrend}</td><td><button class="btn-edit" onclick="editEntry('${uid}')">✏️</button><button class="btn-del" onclick="deleteEntry('${uid}')">🗑️</button></td></tr>`;
        });

        if (incomes.length === 0) {
            tbodyStats.innerHTML = `<tr><td colspan="3" style="text-align:center;">Няма данни.</td></tr>`;
            tbodyEntries.innerHTML = `<tr><td colspan="4" style="text-align:center;">Няма добавени месеци.</td></tr>`;
        }

        if (myChart) myChart.destroy();
        myChart = new Chart(document.getElementById('financeChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: sortedYears.map(y => y + " г."),
                datasets: [{ label: 'Приход (€)', data: sortedYears.map(y => yearlyTotals[y]), backgroundColor: 'rgba(2, 132, 199, 0.2)', borderColor: '#0284c7', borderWidth: 2, borderRadius: 6 }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function clearData() {
        if (confirm("Изтриване на всичко?")) { localStorage.removeItem('financial_diary'); incomes = []; if (myChart) myChart.destroy(); updateUI(); }
    }
    updateUI();
</script>
</body>
</html>
